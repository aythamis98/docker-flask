version: "3.9"

services:
  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flask-backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      LOG_PATH: /home/devops/app/data
      FLASK_ENV: ${FLASK_ENV}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./backend/data:/home/devops/app/data
    networks:
      - frontend
      - backend
    # ⚠️ NO mapear puertos al host para escalar múltiples instancias

  frontend:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask-backend
    networks:
      - frontend

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - backend

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - backend

volumes:
  pgdata:
  redis_data:

networks:
  frontend:
  backend:
