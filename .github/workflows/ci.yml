jobs:
  analyze:
    name: Analizar código y Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Analizar scripts bash
        run: |
          find . -type f -name "*.sh" -exec bash -n {} \;

      - name: Build Docker Compose services
        run: docker-compose -f docker-compose/docker-compose.yml build --quiet
