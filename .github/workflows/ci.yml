name: CI Develop

# Se ejecuta al hacer push a la rama develop
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  analyze:
    name: Analizar código y Docker Compose
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instalar dependencias básicas (opcional)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Lint / análisis de scripts
      - name: Analizar scripts bash
        run: |
          find . -type f -name "*.sh" -exec bash -n {} \;

      # 4️⃣ Build de servicios Docker Compose
      - name: Build Docker Compose
        run: docker-compose -f docker-compose/docker-compose.yml build --quiet

      # 5️⃣ (Opcional) Test app
      - name: Run app tests
        run: docker-compose -f docker-compose/docker-compose.yml run --rm app pytest || echo "No hay tests"
