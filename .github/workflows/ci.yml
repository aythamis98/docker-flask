name: CI Develop

# Triggers: push y pull_request sobre la rama develop
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  analyze-and-build:
    name: Analizar y construir stack Docker Compose
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python (opcional, si tu app lo necesita)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Instalar docker-compose clásico
      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 4️⃣ Analizar scripts bash
      - name: Analizar scripts bash
        run: |
          echo "Analizando todos los scripts .sh..."
          find . -type f -name "*.sh" -exec bash -n {} \;

      # 5️⃣ Construir servicios Docker Compose
      - name: Build Docker Compose
        run: docker-compose -f docker-compose/docker-compose.yml build --quiet

      # 6️⃣ (Opcional) Ejecutar tests de la app
      - name: Run app tests (opcional)
        run: |
          if [ -f docker-compose/docker-compose.yml ]; then
            docker-compose -f docker-compose/docker-compose.yml run --rm app pytest || echo "No hay tests"
          else
            echo "No se encontró docker-compose.yml"
          fi
