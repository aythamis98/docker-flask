name: CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  analyze-and-build:
    name: Analizar y construir stack Docker Compose
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python (opcional)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Copiar variables de entorno
      - name: Setup environment variables
        run: |
          if [ -f docker-compose/.env.example ]; then
            cp docker-compose/.env.example docker-compose/.env
            echo "Archivo .env creado desde .env.example"
          else
            echo "No existe .env.example, se omite"
          fi

      # 4️⃣ Analizar scripts bash
      - name: Analizar scripts bash
        run: |
          echo "Analizando todos los scripts .sh..."
          find . -type f -name "*.sh" -exec bash -n {} \;

      # 5️⃣ Build de servicios Docker Compose desde directorio correcto
      - name: Build Docker Compose
        working-directory: ${{ github.workspace }}/docker-compose
        run: docker compose -f docker-compose.yml build --quiet

      # 6️⃣ (Opcional) Ejecutar tests de la app
      - name: Run app tests (opcional)
        working-directory: ${{ github.workspace }}/docker-compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose run --rm app pytest || echo "No hay tests configurados"
          else
            echo "No se encontró docker-compose.yml"
          fi
